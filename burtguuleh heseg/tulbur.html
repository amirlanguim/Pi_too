<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR төлбөр</title>
<link rel="stylesheet" href="tulbur.css">
</head>

<body>

<header>
    <div class="logo">Pi ИнСпирэйшн</div>
    <nav>
        <a href="#">Нүүр</a>
        <a href="#">Багш нар</a>
    </nav>
    <div>
        <a href="#">Нэвтрэх</a>
        <span class="btn">Бүртгүүлэх</span>
    </div>
</header>

<div class="container">

    <div class="title">
        <h1>QPay төлбөр</h1>
        <p>QR кодыг уншуулж төлбөрөө төлнө үү</p>
    </div>

    <div class="grid">

        <div class="card">
            <h3>Захиалгын дэлгэрэнгүй</h3>

            <div class="row">
                <span>Багш</span>
                <span>С. Цэцэгмаа</span>
            </div>

            <div class="row">
                <span>Хичээл</span>
                <span>Биологи</span>
            </div>

            <div class="row">
                <span>Багц</span>
                <span>75 цаг</span>
            </div>

            <div class="row">
                <span>Хичээлийн тоо</span>
                <span>25 x 3 цаг</span>
            </div>

            <hr style="margin:10px 0;">

            <div class="row total">
                <span>Нийт дүн</span>
                <span>370,000₮</span>
            </div>
        </div>

        <div class="card" style="text-align:center;">
            <h3>QPay</h3>

            <div class="qr-box">
                ⬛⬜
            </div>

            <p style="margin-top:10px;color:gray;">
                QR кодыг уншуулна уу
            </p>

            <button class="pay-btn"><a href="tulburShalgah.html">Төлбөр шалгах</a></button>
        </div>

    </div>

    <button class="prev"><a href="teacherr.html">Өмнөх</a></button>

</div>

</body>
</html>
