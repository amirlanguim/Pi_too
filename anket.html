<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анкет</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #f5f5f5;
}

header {
    display: flex;
    justify-content: space-between;
    padding: 15px 40px;
    background: white;
    border-bottom: 1px solid #ddd;
}

.logo {
    color: #8B0000;
    font-weight: bold;
}

nav a {
    margin: 0 10px;
    text-decoration: none;
    color: #333;
}

.btn {
    background: #8B0000;
    color: white;
    padding: 8px 15px;
    border-radius: 6px;
}
.container {
    max-width: 1000px;
    margin: auto;
    padding: 30px;
}

.steps {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
}

.circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
}

.active {
    background: #8B0000;
    color: white;
}

.line {
    width: 100px;
    height: 2px;
    background: #ddd;
}

.title h1 {
    font-size: 28px;
}

.title p {
    color: gray;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.card h3 {
    margin-bottom: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.full {
    margin-top: 20px;
}

.goal {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 10px;
}

.goal div {
    padding: 5px 0;
    color: gray;
}

.actions {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.prev {
    background: white;
    border: 1px solid #ccc;
    padding: 10px 20px;
    border-radius: 8px;
}

.next {
    background: #8B0000;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
}
</style>

</head>

<body>

<header>
    <div class="logo">Pi ИнСпирэйшн</div>
    <nav>
        <a href="#">Нүүр</a>
        <a href="#">Багш нар</a>
    </nav>
    <div>
        <a href="#">Нэвтрэх</a>
        <span class="btn">Бүртгүүлэх</span>
    </div>
</header>

<div class="container">

    <div class="steps">
        <div class="circle"><a href="SalbarSongoh.html">1</a></div>
        <div class="line"></div>
        <div class="circle"></a>2</div>
        <div class="line"></div>
        <div class="circle"><a href="teacherr.html">3</a></div>
    </div>

    <div class="title">
        <h1>Анкет бөглөх</h1>
        <p>Хүүхдийн болон эцэг эхийн мэдээллийг оруулна уу</p>
    </div>

    <div class="grid">

        <div class="card">
            <h3>Эцэг эх / Асран хамгаалагч</h3>

            <input placeholder="Овог, Нэр">
            <input placeholder="Утас">
            <input placeholder="И-мэйл">
        </div>

        <div class="card">
            <h3>Хүүхдийн мэдээлэл</h3>

            <input placeholder="Овог, Нэр">
            <input placeholder="Нас">
            <input placeholder="Анги">
            <input placeholder="Сургууль">
        </div>

    </div>

    <div class="card full">

        <input placeholder="Одоогийн түвшин">
        <input placeholder="Хуваарийн сонголт">

        <h4>Зорилго</h4>

        <div class="goal">
            <div>ЭЕШ бэлтгэл</div>
            <div>Олимпиад бэлтгэл</div>
            <div>Гадаад сургуульд бэлтгэх</div>
            <div>Дүн сайжруулах</div>
            <div>Суурь мэдлэг бэхжүүлэх</div>
        </div>

    </div>

    <div class="actions">
        <button class="prev">Өмнөх</button>
        <button class="next">Дараах</button>
    </div>

</div>

</body>
</html>
