<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR төлбөр</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #f5f5f5;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    padding: 15px 40px;
    background: white;
    border-bottom: 1px solid #ddd;
}

.logo {
    color: #8B0000;
    font-weight: bold;
}

nav a {
    margin: 0 10px;
    text-decoration: none;
    color: #333;
}

.btn {
    background: #8B0000;
    color: white;
    padding: 8px 15px;
    border-radius: 6px;
}

/* CONTAINER */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 40px;
}

/* TITLE */
.title h1 {
    font-size: 28px;
}

.title p {
    color: gray;
    margin-bottom: 20px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* CARD */
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

/* INFO */
.row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

.total {
    color: #8B0000;
    font-weight: bold;
    font-size: 20px;
}

/* QR */
.qr-box {
    width: 150px;
    height: 150px;
    margin: auto;
    border: 2px dashed #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}

/* BUTTON */
.pay-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #8B0000;
    color: white;
    border: none;
    border-radius: 8px;
}

/* ACTION */
.prev {
    margin-top: 20px;
    padding: 10px 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
}
</style>

</head>

<body>

<header>
    <div class="logo">Pi ИнСпирэйшн</div>
    <nav>
        <a href="#">Нүүр</a>
        <a href="#">Багш нар</a>
    </nav>
    <div>
        <a href="#">Нэвтрэх</a>
        <span class="btn">Бүртгүүлэх</span>
    </div>
</header>

<div class="container">

    <div class="title">
        <h1>QPay төлбөр</h1>
        <p>QR кодыг уншуулж төлбөрөө төлнө үү</p>
    </div>

    <div class="grid">

        <!-- ORDER -->
        <div class="card">
            <h3>Захиалгын дэлгэрэнгүй</h3>

            <div class="row">
                <span>Багш</span>
                <span>С. Цэцэгмаа</span>
            </div>

            <div class="row">
                <span>Хичээл</span>
                <span>Биологи</span>
            </div>

            <div class="row">
                <span>Багц</span>
                <span>75 цаг</span>
            </div>

            <div class="row">
                <span>Хичээлийн тоо</span>
                <span>25 x 3 цаг</span>
            </div>

            <hr style="margin:10px 0;">

            <div class="row total">
                <span>Нийт дүн</span>
                <span>370,000₮</span>
            </div>
        </div>

        <!-- QR -->
        <div class="card" style="text-align:center;">
            <h3>QPay</h3>

            <div class="qr-box">
                ⬛⬜
            </div>

            <p style="margin-top:10px;color:gray;">
                QR кодыг уншуулна уу
            </p>

            <button class="pay-btn">Төлбөр шалгах</button>
        </div>

    </div>

    <button class="prev">Өмнөх</button>

</div>

</body>
</html>
